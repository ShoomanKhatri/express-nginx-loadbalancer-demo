version: "3.8"
services:
  backend1:
    build: .
    container_name: backend1
    hostname: backend1

  backend2:
    build: .
    container_name: backend2
    hostname: backend2

  backend3:
    build: .
    container_name: backend3
    hostname: backend3

  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3
